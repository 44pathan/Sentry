<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentry AI</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>

  <!-- Compact brand + tab row -->
  <div class="panel-header">
    <span class="panel-brand">⬡ SENTRY</span>
    <span id="ai-provider-badge" style="font-size:9px;color:var(--text-muted);letter-spacing:0.5px;"></span>
  </div>

  <div class="panel-tabs">
    <button class="tab-btn active" data-tab="ai-analysis">AI Analysis</button>
    <button class="tab-btn"        data-tab="live-scans">Live Scans</button>
  </div>

  <!-- AI Analysis tab -->
  <div id="ai-analysis-tab" class="tab-content active">

    <div id="ai-setup-banner" class="ai-setup-banner hidden">
      AI unavailable — configure an API key in Settings.
    </div>

    <!-- Scan selector -->
    <div class="context-header">
      <select id="context-selector" class="context-selector">
        <option value="">Select scan to analyze…</option>
      </select>
    </div>

    <!-- Quick action pills -->
    <div class="quick-actions">
      <button class="btn-action" id="btn-exec-summary">Executive Summary</button>
      <button class="btn-action" id="btn-prioritize">Prioritize Fixes</button>
      <button class="btn-action" id="btn-owasp">OWASP Analysis</button>
    </div>

    <!-- Chat messages -->
    <div id="chat-area" class="chat-area"></div>

    <!-- Input bar -->
    <div class="chat-input-area">
      <textarea id="chat-input"
        placeholder="Ask about vulnerabilities, remediations…"
        rows="1"></textarea>
      <button id="btn-send" class="btn-send">Send</button>
    </div>

  </div>

  <!-- Live Scans tab -->
  <div id="live-scans-tab" class="tab-content">
    <div id="scan-list" class="scan-list"></div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
